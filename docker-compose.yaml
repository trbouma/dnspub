services:
  dnspub:
    build:
      context: .
    image: dnspub:local
    restart: unless-stopped
    ports:
      - "${DNS_BIND_ADDRESS:-127.0.0.1}:${DNS_HOST_PORT:-5353}:53/udp"
      - "${DNS_BIND_ADDRESS:-127.0.0.1}:${DNS_HOST_PORT:-5353}:53/tcp"
    environment:
      DNS_HOST: "0.0.0.0"
      DNS_PORT: "53"
      PUBLIC_IP: "${PUBLIC_IP:-auto}"
      PUBLIC_IP_DISCOVERY_URL: "${PUBLIC_IP_DISCOVERY_URL:-https://api.ipify.org}"
      PUBLIC_IP_DISCOVERY_TIMEOUT: "${PUBLIC_IP_DISCOVERY_TIMEOUT:-3.0}"
      ZONE: "${ZONE:-dnspub.xyz.}"
      NS_HOST: "${NS_HOST:-ns1.dnspub.xyz.}"
      SOA_RNAME: "${SOA_RNAME:-hostmaster.dnspub.xyz.}"
      SOA_SERIAL: "${SOA_SERIAL:-2026071901}"
      NOSTR_FETCH_TIMEOUT: "${NOSTR_FETCH_TIMEOUT:-1.0}"
      NOSTR_RELAYS: '${NOSTR_RELAYS:-["wss://relay.damus.io","wss://nos.lol","wss://relay.primal.net","wss://relay.snort.social"]}'
      KIND_DNS: "${KIND_DNS:-11111}"
      CACHE_ACTIVATED: "${CACHE_ACTIVATED:-true}"
      CACHE_WRITEBACK: "${CACHE_WRITEBACK:-true}"
      DB_PATH: "/app/data/npubcache.sqlite3"
    volumes:
      - dnspub-data:/app/data

volumes:
  dnspub-data:
